{% extends "base.html" %}

{% block title %}Log ind{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-4">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h3 mb-4"><i class="bi bi-person-circle me-2"></i>Log ind</h1>
        <form method="post">
          {% csrf_token %}
          <input type="hidden" name="next" value="{{ next }}">
          {% if form.non_field_errors %}
            <div class="alert alert-danger py-2" role="alert">{{ form.non_field_errors|join:" " }}</div>
          {% endif %}
          <div class="mb-3">
            <label for="{{ form.username.id_for_label }}" class="form-label">{{ form.username.label }}</label>
            {{ form.username }}
          </div>
          <div class="mb-4">
            <label for="{{ form.password.id_for_label }}" class="form-label">{{ form.password.label }}</label>
            {{ form.password }}
          </div>
          <button type="submit" class="btn btn-primary w-100">Log ind</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
