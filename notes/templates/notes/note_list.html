{% load static %}
<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Noter</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    form p { margin: .5rem 0; }
    input, textarea { width: 100%; box-sizing: border-box; }
    .note { border: 1px solid #ddd; border-radius: 6px; padding: .75rem; margin: .75rem 0; }
    .note small { color: #666; }
    .search { margin: 1.5rem 0 .5rem; position: relative; }
    .errors { color: #b00020; }
    #loader {
      display: none; position: absolute; right: .5rem; top: 50%; margin-top: -9px;
      width: 14px; height: 14px; border: 2px solid #ccc; border-top-color: #333;
      border-radius: 50%; animation: spin .7s linear infinite;
    }
    .loading #loader { display: block; }
    .loading #note-list { opacity: .5; transition: opacity .15s; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <h1>Noter</h1>
  <form method="post" id="note-form">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="errors" id="form-errors"></div>
    <button type="submit">Gem note</button>
  </form>

  <form method="get" class="search" id="search-form">
    <input type="search" name="q" value="{{ query }}" placeholder="Søg i noter…" autocomplete="off" aria-label="Søg i noter">
    <span id="loader" role="status" aria-label="Indlæser"></span>
  </form>

  <div id="note-list">
    {% include "notes/_note_list.html" %}
  </div>

  <script src="{% static 'notes/notes.js' %}"></script>
</body>
</html>
