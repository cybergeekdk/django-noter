{% extends "base.html" %}

{% block title %}Slet udstyr{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-5">
    <div class="card border-danger">
      <div class="card-body p-4">
        <h1 class="h4 text-danger"><i class="bi bi-exclamation-triangle me-2"></i>Slet udstyr</h1>
        <p class="mt-3">Er du sikker på, at du vil slette <strong>{{ object.name }}</strong>{% if object.quantity > 1 %} ({{ object.quantity }} stk.){% endif %}? Det kan ikke fortrydes.</p>
        <form method="post" class="d-flex gap-2">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger">Ja, slet</button>
          <a href="{% url 'inventory:list' %}" class="btn btn-outline-secondary">Annullér</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
